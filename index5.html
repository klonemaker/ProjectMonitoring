<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Project Delays Dashboard</title>
    <!-- Include SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Include Inter font for a professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1e293b; 
            --accent: #2563eb; 
            --accent-hover: #1d4ed8; 
            --bg-color: #f8fafc; 
            --card-bg: #ffffff;
            --text-main: #334155; 
            --text-muted: #64748b; 
            --border-color: #e2e8f0; 
            --success: #16a34a; 
            --warning: #ea580c; 
            --danger: #dc2626;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 30px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
        }

        .container { 
            background-color: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); 
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h2 { margin: 0; color: var(--primary); font-size: 24px; font-weight: 700; }
        .stats { font-size: 14px; font-weight: 600; color: var(--text-muted); }

        /* Upload Section */
        .upload-section { background: #eef2f5; padding: 20px; border-radius: 8px; border: 1px dashed #d1d8dd; margin-bottom: 25px; display: flex; align-items: center; gap: 20px; }
        input[type="file"] { padding: 10px; font-size: 14px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; background: white; cursor: pointer; transition: border-color 0.3s;}
        input[type="file"]:hover { border-color: var(--accent); }
        
        /* Filter Sections */
        .filter-section { margin-bottom: 25px; }
        .selector-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); }
        
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .filter-btn { 
            background-color: var(--bg-color); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500; 
            transition: all 0.2s ease; 
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--accent); background-color: #eff6ff; }
        .filter-btn.active { background-color: var(--accent); color: #ffffff; border-color: var(--accent); box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); }

        .search-container input { 
            width: 100%; 
            max-width: 400px; 
            padding: 10px 15px; 
            font-size: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            outline: none; 
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* Table Styles */
        .table-container { max-height: 600px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 12px 15px; text-align: left; vertical-align: middle; font-size: 13px; line-height: 1.4; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; z-index: 10; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; border-bottom: none;}
        tr:hover { background-color: #f8fafc; }
        
        mark { background-color: #fef08a; color: #000; padding: 0 2px; border-radius: 2px; font-weight: 600; }
        
        .project-link { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; transition: color 0.2s; border-bottom: 1px dashed var(--accent); }
        .project-link:hover { color: var(--accent-hover); border-bottom-style: solid; }

        /* Badges */
        .badge-period { background-color: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; display: inline-block; color: var(--text-main); border: 1px solid var(--border-color); }
        .badge-zone { color: var(--accent); font-weight: 700; }
        .category-tag { background-color: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; margin: 2px 4px 2px 0;}

        /* Modal Styles - Enhanced for Readability */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }
        .modal-content { 
            background-color: #fff; 
            margin: 4vh auto; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 900px; 
            max-height: 90vh; /* Limits height to viewport */
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
            position: relative; 
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        @keyframes modalFadeIn { from {opacity: 0; transform: translateY(-20px) scale(0.98);} to {opacity: 1; transform: translateY(0) scale(1);} }
        
        .modal-header-fixed {
            padding: 30px 35px 20px 35px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .close-btn { position: absolute; right: 25px; top: 25px; font-size: 28px; color: var(--text-muted); cursor: pointer; background: none; border: none; padding: 5px; line-height: 1; border-radius: 4px;}
        .close-btn:hover { color: var(--primary); background-color: #f1f5f9;}
        
        .modal-title { font-size: 24px; font-weight: 700; color: var(--primary); margin: 0; padding-right: 40px; line-height: 1.3; }
        
        #modalBody {
            padding: 25px 35px 35px 35px;
            overflow-y: auto; /* Scrollable body */
        }

        .modal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; background: #f8fafc; padding: 25px; border-radius: 8px; border: 1px solid var(--border-color);}
        .modal-data-group { display: flex; flex-direction: column; gap: 6px; }
        .modal-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        .modal-value { font-size: 16px; font-weight: 600; color: var(--primary); }
        
        .modal-section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .modal-long-text { 
            background: #f8fafc; 
            padding: 20px 25px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            white-space: pre-wrap; 
            font-size: 15px; 
            color: var(--text-main); 
            line-height: 1.6; 
            margin-bottom: 30px;
        }
        
        .time-border { border-left: 4px solid var(--warning); }
        .cost-border { border-left: 4px solid var(--danger); }

        #dashboard { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <h2>Project Delays Dashboard</h2>
            <div class="stats" id="recordCount">Projects found: 0</div>
        </div>

        <div class="upload-section" id="uploadSection">
            <div>
                <label for="fileUpload" style="font-weight: bold; display: block; margin-bottom: 8px; color: var(--primary);">Upload PMO Project Excel File (.xlsx):</label>
                <input type="file" id="fileUpload" accept=".xlsx, .xls" />
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">Upload the file to automatically merge sheets and extract overrun data.</p>
            </div>
            <div id="loadingStatus" style="font-weight: bold; color: var(--warning);"></div>
        </div>

        <div id="dashboard">
            <!-- Filter 1: Overrun Category -->
            <div class="filter-section">
                <div class="selector-title">1. Time Overrun Category</div>
                <div id="reasonContainer" class="filter-group"></div>
            </div>
            
            <!-- Filter 2: Sanction Period -->
            <div class="filter-section">
                <div class="selector-title">2. Sanction Period</div>
                <div id="periodContainer" class="filter-group"></div>
            </div>
            
            <!-- Filter 3: Railway Zone -->
            <div class="filter-section">
                <div class="selector-title">3. Railway Zone</div>
                <div id="zoneContainer" class="filter-group"></div>
            </div>

            <!-- Filter 4: Search Bar -->
            <div class="filter-section">
                <div class="selector-title">4. Search Project Name</div>
                <div class="search-container">
                    <input type="text" id="searchBar" placeholder="Search projects..." onkeyup="applyFilters()" />
                </div>
            </div>
            
            <div class="table-container">
                <table id="reportTable">
                    <thead>
                        <tr>
                            <th style="width: 10%;">Period</th>
                            <th style="width: 8%;">Zone</th>
                            <th style="width: 32%;">Project Name (Click for Details)</th>
                            <th style="width: 25%;">Delay Categories</th>
                            <th style="width: 12%;">Sanctioned</th>
                            <th style="width: 13%;">Cost (Cr)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Background -->
    <div id="projectModal" class="modal" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <div class="modal-header-fixed">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h3 class="modal-title" id="modalTitle">Project Name</h3>
            </div>
            <div id="modalBody">
                <!-- Details injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        let globalData = [];
        let currentViewData = [];
        let currentZone = "All";
        let currentPeriod = "All";
        let currentReason = "All";

        const DELAY_CATEGORIES = [
            "Forest Clearance & Wildlife",
            "Land Acquisition",
            "Phase wise Sanctioning",
            "Law & Order issue",
            "Utility Shifting"
        ];

        document.getElementById('fileUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loadingStatus').textContent = 'Processing file...';

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    
                    if (typeof XLSX === 'undefined') {
                        document.getElementById('loadingStatus').innerHTML = `Error: Excel reading library is blocked.`;
                        return;
                    }

                    const workbook = XLSX.read(data, {type: 'array'});
                    let allCombinedData = [];

                    workbook.SheetNames.forEach(sheetName => {
                        let period = "";
                        const lowerName = sheetName.toLowerCase();
                        
                        if(lowerName.includes("before 2014")) period = "Before 2014";
                        else if(lowerName.includes("14-19")) period = "2014-19";
                        else if(lowerName.includes("19-24")) period = "2019-24";
                        else return; 

                        const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {defval: "", raw: false});
                        
                        rawData.forEach(row => {
                            const getVal = (searchStr) => {
                                const key = Object.keys(row).find(k => String(k).replace(/\s+/g, ' ').toLowerCase().includes(searchStr.toLowerCase()));
                                return key ? (row[key] || "").toString().trim() : "";
                            };

                            let categories = [];
                            
                            if (getVal("forest clearance") || getVal("wildlife")) categories.push(DELAY_CATEGORIES[0]);
                            if (getVal("land acquisition")) categories.push(DELAY_CATEGORIES[1]);
                            if (getVal("phase wise")) categories.push(DELAY_CATEGORIES[2]);
                            if (getVal("law & order") || getVal("law and order")) categories.push(DELAY_CATEGORIES[3]);
                            if (getVal("utility shifting")) categories.push(DELAY_CATEGORIES[4]);

                            if(categories.length > 0) {
                                allCombinedData.push({
                                    'Period': period,
                                    'Zone': getVal("Rly") || getVal("Zone"),
                                    'Project Name': getVal("Name of Project"),
                                    'Categories': categories,
                                    'Time Reason': getVal("Reasons for Time overrun") || "No detailed time overrun reason provided.",
                                    'Cost Reason': getVal("Reasons for Cost Over run") || "No detailed cost overrun reason provided.",
                                    'Sanctioned Year': getVal("Sanctioned Year"),
                                    'Length (Km)': getVal("Length of project"),
                                    'Original Cost': getVal("Original Sanctioned Cost"),
                                    'Anticipated Cost': getVal("Anticipated Cost")
                                });
                            }
                        });
                    });

                    if (allCombinedData.length === 0) {
                        document.getElementById('loadingStatus').textContent = "No valid projects found.";
                        return;
                    }

                    globalData = allCombinedData;
                    
                    document.getElementById('uploadSection').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    
                    renderSelectors();
                    applyFilters();

                } catch (error) {
                    console.error(error);
                    document.getElementById('loadingStatus').textContent = 'Error loading data. Invalid file format.';
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function renderSelectors() {
            const zones = new Set();
            const periods = new Set();

            globalData.forEach(row => {
                if (row['Zone']) zones.add(row['Zone']);
                if (row['Period']) periods.add(row['Period']);
            });

            // 1. Render Overrun Categories Filter
            let rHtml = `<div class="filter-btn active" onclick="setFilter('reason', 'All', this)">All Categories</div>`;
            DELAY_CATEGORIES.forEach(r => {
                rHtml += `<div class="filter-btn" onclick="setFilter('reason', '${r}', this)">${r}</div>`;
            });
            document.getElementById('reasonContainer').innerHTML = rHtml;

            // 2. Render Period Filters
            let pHtml = `<div class="filter-btn active" onclick="setFilter('period', 'All', this)">All Periods</div>`;
            const sortedPeriods = Array.from(periods).sort((a,b) => a.localeCompare(b));
            sortedPeriods.forEach(p => {
                pHtml += `<div class="filter-btn" onclick="setFilter('period', '${p}', this)">${p}</div>`;
            });
            document.getElementById('periodContainer').innerHTML = pHtml;
            
            // 3. Render Zone Filters
            let zHtml = `<div class="filter-btn active" onclick="setFilter('zone', 'All', this)">All Zones</div>`;
            Array.from(zones).sort().forEach(z => {
                zHtml += `<div class="filter-btn" onclick="setFilter('zone', '${z}', this)">${z}</div>`;
            });
            document.getElementById('zoneContainer').innerHTML = zHtml;
        }

        function setFilter(type, val, element) {
            if (type === 'zone') {
                currentZone = val;
                document.querySelectorAll('#zoneContainer .filter-btn').forEach(el => el.classList.remove('active'));
            } else if (type === 'period') {
                currentPeriod = val;
                document.querySelectorAll('#periodContainer .filter-btn').forEach(el => el.classList.remove('active'));
            } else if (type === 'reason') {
                currentReason = val;
                document.querySelectorAll('#reasonContainer .filter-btn').forEach(el => el.classList.remove('active'));
            }
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchInput = document.getElementById('searchBar').value.trim();
            const searchText = searchInput.toLowerCase();

            currentViewData = globalData.filter(row => {
                const projName = (row['Project Name'] || "").toLowerCase();
                const matchSearch = searchText === "" || projName.includes(searchText);
                
                const matchZone = currentZone === "All" || row['Zone'] === currentZone;
                const matchPeriod = currentPeriod === "All" || row['Period'] === currentPeriod;
                const matchReason = currentReason === "All" || row['Categories'].includes(currentReason);

                return matchSearch && matchZone && matchPeriod && matchReason;
            });

            renderTable(currentViewData, searchInput);
        }

        function renderTable(data, searchInput) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('recordCount').textContent = `Showing ${data.length} projects`;
            
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">No projects found matching the criteria.</td></tr>';
                return;
            }

            const fragment = document.createDocumentFragment();

            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                
                let projHtml = row['Project Name'];
                if (searchInput) {
                    const escapedSearchText = searchInput.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${escapedSearchText})`, "gi");
                    projHtml = projHtml.replace(regex, '<mark>$1</mark>');
                }

                let catHtml = row['Categories'].map(c => `<span class="category-tag">${c}</span>`).join('');

                tr.innerHTML = `
                    <td><span class="badge-period">${row['Period']}</span></td>
                    <td class="badge-zone">${row['Zone']}</td>
                    <td><a class="project-link" onclick="openModal(${idx})">${projHtml}</a></td>
                    <td>${catHtml}</td>
                    <td>${row['Sanctioned Year'] || '-'}</td>
                    <td style="font-weight: 500;">${row['Original Cost'] ? '₹' + row['Original Cost'] : '-'}</td>
                `;
                fragment.appendChild(tr);
            });
            
            tbody.appendChild(fragment);
        }

        function openModal(idx) {
            const row = currentViewData[idx];
            document.getElementById('modalTitle').textContent = row['Project Name'];
            
            let catHtml = row['Categories'].map(c => `<span class="category-tag">${c}</span>`).join('');

            const detailsHtml = `
                <div class="modal-grid">
                    <div class="modal-data-group">
                        <span class="modal-label">Zone</span>
                        <span class="modal-value" style="color: var(--accent);">${row['Zone']}</span>
                    </div>
                    <div class="modal-data-group">
                        <span class="modal-label">Sanction Period</span>
                        <span class="modal-value">${row['Period']}</span>
                    </div>
                    <div class="modal-data-group">
                        <span class="modal-label">Sanctioned Year</span>
                        <span class="modal-value">${row['Sanctioned Year'] || 'N/A'}</span>
                    </div>
                    <div class="modal-data-group">
                        <span class="modal-label">Project Length</span>
                        <span class="modal-value">${row['Length (Km)'] ? row['Length (Km)'] + ' Km' : 'N/A'}</span>
                    </div>
                    <div class="modal-data-group">
                        <span class="modal-label">Original Cost</span>
                        <span class="modal-value">${row['Original Cost'] ? '₹ ' + row['Original Cost'] + ' Cr' : 'N/A'}</span>
                    </div>
                    <div class="modal-data-group">
                        <span class="modal-label">Anticipated Cost</span>
                        <span class="modal-value">${row['Anticipated Cost'] ? '₹ ' + row['Anticipated Cost'] + ' Cr' : 'N/A'}</span>
                    </div>
                </div>
                
                <div class="modal-section-title" style="color: var(--warning);">
                    ⚠️ Time Overrun Categories
                </div>
                <div style="margin-bottom: 25px;">${catHtml}</div>
                
                <div class="modal-section-title" style="color: var(--warning);">
                    Detailed Reasons for Time Overrun
                </div>
                <div class="modal-long-text time-border">${row['Time Reason']}</div>

                <div class="modal-section-title" style="color: var(--danger);">
                    Detailed Reasons for Cost Overrun
                </div>
                <div class="modal-long-text cost-border" style="margin-bottom: 0;">${row['Cost Reason']}</div>
            `;
            
            document.getElementById('modalBody').innerHTML = detailsHtml;
            document.getElementById('projectModal').style.display = 'block';
            
            // Reset modal scroll position to top
            document.getElementById('modalBody').scrollTop = 0;
        }

        function closeModal() { document.getElementById('projectModal').style.display = 'none'; }
        function closeModalOutside(event) {
            if (event.target === document.getElementById('projectModal')) closeModal();
        }
    </script>
</body>
</html>
